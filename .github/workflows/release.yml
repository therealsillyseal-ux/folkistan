name: Windows release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check version and prevent overwriting a published release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = node -p "require('./package.json').version"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Release version must be a stable semantic version.' }
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Install dependencies
        if: steps.version.outputs.exists != 'true'
        run: npm ci
      - name: Test update state machine and browser helpers
        if: steps.version.outputs.exists != 'true'
        run: npm test
      - name: Build Windows installer and update metadata
        if: steps.version.outputs.exists != 'true'
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
        run: npm run build:win
      - name: Publish installer, blockmap and latest.yml together
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -like 'Folkistan-Setup-*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' }
          if (($assets | Where-Object Name -eq 'latest.yml').Count -ne 1) { throw 'Missing update metadata.' }
          if (($assets | Where-Object Name -like 'Folkistan-Setup-*.exe').Count -ne 1) { throw 'Missing installer.' }
          $notes = "Experimental Windows x64 installer. Unsigned and not independently audited. Install this version manually once; subsequent published versions can be downloaded through Settings > Automatic updates. Installation always asks before restarting. Avoid sensitive accounts."
          gh release create "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Folkistan $env:TAG" --notes "$notes" --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $paths = $assets.FullName
          gh release upload "$env:TAG" @paths --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains draft.' }
          gh release edit "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
